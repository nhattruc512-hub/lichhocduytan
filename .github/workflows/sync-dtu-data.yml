name: Sync DTU open classes

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "scripts/sync-dtu-data.mjs"
      - ".github/workflows/sync-dtu-data.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-dtu-data-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync public DTU data
        run: node scripts/sync-dtu-data.mjs

      - name: Show dataset summary
        run: node -e "const d=require('./data/classes.json'); console.log({semester:d.semester,courseCount:d.courseCount,openClassCount:d.openClassCount})"

      - name: Commit refreshed dataset
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/classes.json; then
            echo "No dataset changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/classes.json
          git commit -m "data: refresh DTU open classes"
          git push origin main
